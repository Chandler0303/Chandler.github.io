<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>个人简历</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Noto+Sans+SC:wght@300;400;500&family=Noto+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #f5f4f0;
    --surface: #ffffff;
    --text: #1a1a18;
    --muted: #6b6b65;
    --accent: #1a4a3a;
    --accent-light: #e8f0ed;
    --border: #e0dfd8;
    --tag-bg: #eeecea;
    --mono: 'DM Mono', monospace;
    --sans-en: 'Noto Sans', sans-serif;
    --sans-zh: 'Noto Sans SC', sans-serif;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: var(--sans-zh);
    font-size: 15px;
    line-height: 1.7;
    -webkit-font-smoothing: antialiased;
  }

  body.lang-en {
    font-family: var(--sans-en);
  }

  /* ── NAV ── */
  .nav {
    position: fixed;
    top: 0; left: 0; right: 0;
    z-index: 100;
    display: flex;
    justify-content: flex-end;
    align-items: center;
    gap: 12px;
    padding: 14px 40px;
    background: rgba(245,244,240,0.85);
    backdrop-filter: blur(12px);
    border-bottom: 1px solid var(--border);
  }

  .lang-btn {
    font-family: var(--mono);
    font-size: 12px;
    letter-spacing: 0.08em;
    padding: 5px 14px;
    border-radius: 20px;
    cursor: pointer;
    border: 1px solid var(--border);
    background: transparent;
    color: var(--muted);
    transition: all 0.2s;
  }
  .lang-btn.active {
    background: var(--accent);
    color: #fff;
    border-color: var(--accent);
  }
  .lang-btn:hover:not(.active) {
    border-color: var(--accent);
    color: var(--accent);
  }

  .print-btn {
    font-family: var(--mono);
    font-size: 12px;
    letter-spacing: 0.06em;
    padding: 5px 16px;
    border-radius: 20px;
    cursor: pointer;
    border: 1px solid var(--accent);
    background: var(--accent);
    color: #fff;
    transition: all 0.2s;
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .print-btn:hover { opacity: 0.85; }
  .print-btn svg { width: 13px; height: 13px; }

  /* ── LAYOUT ── */
  .page {
    max-width: 860px;
    margin: 0 auto;
    padding: 100px 40px 80px;
  }

  /* ── HEADER ── */
  .header {
    display: grid;
    grid-template-columns: 1fr auto;
    gap: 24px;
    align-items: end;
    padding-bottom: 32px;
    border-bottom: 2px solid var(--text);
    margin-bottom: 40px;
  }

  .header-name {
    font-size: 42px;
    font-weight: 500;
    letter-spacing: -0.02em;
    line-height: 1.1;
  }

  .header-title {
    font-family: var(--mono);
    font-size: 13px;
    color: var(--muted);
    letter-spacing: 0.06em;
    margin-top: 8px;
  }

  .header-contacts {
    display: flex;
    flex-direction: column;
    align-items: flex-end;
    gap: 4px;
  }

  .contact-item {
    font-family: var(--mono);
    font-size: 12px;
    color: var(--muted);
    display: flex;
    align-items: center;
    gap: 6px;
    text-decoration: none;
  }
  .contact-item:hover { color: var(--accent); }
  .contact-item span { font-size: 14px; }

  /* ── SECTIONS ── */
  .section {
    margin-bottom: 36px;
  }

  .section-label {
    font-family: var(--mono);
    font-size: 11px;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--accent);
    margin-bottom: 16px;
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .section-label::after {
    content: '';
    flex: 1;
    height: 1px;
    background: var(--border);
  }

  /* ── ABOUT ── */
  .about-text {
    color: var(--muted);
    font-size: 15px;
    line-height: 1.8;
    max-width: 640px;
  }

  /* ── EXPERIENCE ── */
  .exp-item {
    display: grid;
    grid-template-columns: 140px 1fr;
    gap: 0 24px;
    padding: 20px 0;
    border-bottom: 1px solid var(--border);
  }
  .exp-item:last-child { border-bottom: none; }

  .exp-meta {
    padding-top: 3px;
  }

  .exp-period {
    font-family: var(--mono);
    font-size: 11px;
    color: var(--muted);
    line-height: 1.5;
  }

  .exp-company {
    font-size: 12px;
    color: var(--accent);
    font-weight: 500;
    margin-top: 4px;
  }

  .exp-role {
    font-weight: 500;
    font-size: 15px;
    margin-bottom: 6px;
  }

  .exp-desc {
    color: var(--muted);
    font-size: 14px;
    line-height: 1.75;
  }

  .exp-bullets {
    list-style: none;
    margin-top: 8px;
  }
  .exp-bullets li {
    color: var(--muted);
    font-size: 14px;
    line-height: 1.75;
    padding-left: 14px;
    position: relative;
    margin-bottom: 2px;
  }
  .exp-bullets li::before {
    content: '—';
    position: absolute;
    left: 0;
    color: var(--border);
  }

  /* ── SKILLS ── */
  .skills-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
    gap: 16px;
  }

  .skill-group {}

  .skill-group-name {
    font-family: var(--mono);
    font-size: 11px;
    color: var(--muted);
    letter-spacing: 0.06em;
    margin-bottom: 8px;
  }

  .skill-tags {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
  }

  .tag {
    font-family: var(--mono);
    font-size: 12px;
    background: var(--tag-bg);
    color: var(--text);
    padding: 3px 10px;
    border-radius: 4px;
    border: 1px solid var(--border);
  }

  /* ── EDUCATION ── */
  .edu-item {
    display: grid;
    grid-template-columns: 140px 1fr;
    gap: 0 24px;
    padding: 16px 0;
    border-bottom: 1px solid var(--border);
  }
  .edu-item:last-child { border-bottom: none; }

  .edu-degree { font-weight: 500; font-size: 15px; }
  .edu-school { font-size: 13px; color: var(--accent); margin-top: 2px; }
  .edu-detail { font-size: 13px; color: var(--muted); margin-top: 2px; }

  /* ── PROJECTS ── */
  .proj-category {
    font-family: var(--mono);
    font-size: 11px;
    color: var(--muted);
    letter-spacing: 0.08em;
    margin-top: 20px;
    padding-top: 4px;
  }
  .proj-category:first-child {
    margin-top: 0;
  }

  .proj-item {
    padding: 18px 0;
    border-bottom: 1px solid var(--border);
  }
  .proj-item:last-child { border-bottom: none; }

  .proj-header {
    display: flex;
    align-items: baseline;
    gap: 10px;
    margin-bottom: 6px;
  }

  .proj-name {
    font-weight: 500;
    font-size: 15px;
  }

  .proj-link {
    font-family: var(--mono);
    font-size: 11px;
    color: var(--accent);
    text-decoration: none;
    letter-spacing: 0.04em;
  }
  .proj-link:hover { text-decoration: underline; }

  .proj-desc {
    color: var(--muted);
    font-size: 14px;
    line-height: 1.75;
    margin-bottom: 8px;
  }

  .proj-bullets {
    list-style: none;
    margin: 6px 0 10px;
  }
  .proj-bullets li {
    color: var(--muted);
    font-size: 14px;
    line-height: 1.7;
    padding-left: 14px;
    position: relative;
    margin-bottom: 2px;
  }
  .proj-bullets li::before {
    content: '—';
    position: absolute;
    left: 0;
    color: var(--border);
  }

  /* ── PRINT ── */
  @media print {
    @page {
      size: A4;
      margin: 18mm 18mm 18mm 18mm;
    }

    body {
      background: #fff;
      font-size: 13px;
    }

    .nav { display: none !important; }

    .page {
      max-width: 100%;
      padding: 0;
    }

    .header {
      padding-bottom: 20px;
      margin-bottom: 24px;
    }

    .header-name { font-size: 28px; }

    .section { margin-bottom: 22px; }

    .exp-item, .edu-item, .proj-item {
      page-break-inside: avoid;
    }

    .tag {
      background: #f0f0ee;
      border-color: #ddd;
    }
  }

  /* ── ANIM ── */
  .fade-section {
    opacity: 0;
    transform: translateY(12px);
    animation: fadeUp 0.5s ease forwards;
  }

  @keyframes fadeUp {
    to { opacity: 1; transform: translateY(0); }
  }

  .section:nth-child(1) { animation-delay: 0.05s; }
  .section:nth-child(2) { animation-delay: 0.12s; }
  .section:nth-child(3) { animation-delay: 0.19s; }
  .section:nth-child(4) { animation-delay: 0.26s; }
  .section:nth-child(5) { animation-delay: 0.33s; }
</style>
</head>

  }
};
// ═══════════════════════════════════════════════

let currentLang = 'zh';

function setLang(lang) {
  currentLang = lang;
  document.documentElement.lang = lang;
  document.body.className = 'lang-' + lang;
  document.getElementById('btn-zh').className = 'lang-btn' + (lang === 'zh' ? ' active' : '');
  document.getElementById('btn-en').className = 'lang-btn' + (lang === 'en' ? ' active' : '');
  document.getElementById('dl-label').textContent = DATA[lang].labels.download;
  render(lang);
}

function render(lang) {
  const d = DATA[lang];
  const r = document.getElementById('resume');

  const contacts = d.contacts.map(c =>
    c.href
      ? `<a class="contact-item" href="${c.href}"><span>${c.icon}</span>${c.label}</a>`
      : `<span class="contact-item"><span>${c.icon}</span>${c.label}</span>`
  ).join('');

  const experience = d.experience.map(e => `
    <div class="exp-item">
      <div class="exp-meta">
        <div class="exp-period">${e.period}</div>
        <div class="exp-company">${e.company}</div>
      </div>
      <div class="exp-body">
        <div class="exp-role">${e.role}</div>
        <ul class="exp-bullets">
          ${e.bullets.map(b => `<li>${b}</li>`).join('')}
        </ul>
      </div>
    </div>
  `).join('');

  const skills = d.skills.map(s => `
    <div class="skill-group">
      <div class="skill-group-name">${s.name}</div>
      <div class="skill-tags">${s.tags.map(t => `<span class="tag">${t}</span>`).join('')}</div>
    </div>
  `).join('');

  const education = d.education.map(e => `
    <div class="edu-item">
      <div class="exp-meta">
        <div class="exp-period">${e.period}</div>
      </div>
      <div>
        <div class="edu-degree">${e.degree}</div>
        <div class="edu-school">${e.school}</div>
        <div class="edu-detail">${e.detail}</div>
      </div>
    </div>
  `).join('');

  let lastProjectCategory = '';
  const projectList = [...d.projects].sort((a, b) => Number(Boolean(b.featured)) - Number(Boolean(a.featured)));
  const projects = projectList.map(p => {
    const category = p.category && p.category !== lastProjectCategory
      ? `<div class="proj-category">${p.category}</div>`
      : '';
    lastProjectCategory = p.category || lastProjectCategory;

    const bullets = p.bullets && p.bullets.length
      ? `<ul class="proj-bullets">${p.bullets.map(b => `<li>${b}</li>`).join('')}</ul>`
      : '';

    return `
      ${category}
      <div class="proj-item">
        <div class="proj-header">
          <span class="proj-name">${p.name}</span>
          <a class="proj-link" href="${p.href}" target="_blank" rel="noopener noreferrer">↗ ${p.link}</a>
        </div>
        <div class="proj-desc">${p.desc}</div>
        ${bullets}
        <div class="skill-tags">${(p.tags||[]).map(t => `<span class="tag">${t}</span>`).join('')}</div>
      </div>
    `;
  }).join('');

  r.innerHTML = `
    <div class="header fade-section">
      <div>
        <div class="header-name">${d.name}</div>
        <div class="header-title">${d.title}</div>
      </div>
      <div class="header-contacts">${contacts}</div>
    </div>

    <div class="section fade-section">
      <div class="section-label">${d.labels.about}</div>
      <div class="about-text">${d.about}</div>
    </div>

    <div class="section fade-section">
      <div class="section-label">${d.labels.experience}</div>
      ${experience}
    </div>

    <div class="section fade-section">
      <div class="section-label">${d.labels.skills}</div>
      <div class="skills-grid">${skills}</div>
    </div>

    <div class="section fade-section">
      <div class="section-label">${d.labels.education}</div>
      ${education}
    </div>

    <div class="section fade-section">
      <div class="section-label">${d.labels.projects}</div>
      ${projects}
    </div>
  `;
}

render('zh');
</script>
